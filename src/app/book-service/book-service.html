<div class="booking-container">

  <div class="booking-card">

    <h2>Book a Service</h2>

    <p class="subtitle">
      Tell us what you need and we'll find a suitable professional.
    </p>


    <div
      class="success-message"
      *ngIf="successMessage"
    >
      {{ successMessage }}
    </div>


    <div
      class="error-message"
      *ngIf="errorMessage"
    >
      {{ errorMessage }}
    </div>


    <form
      [formGroup]="requestForm"
      (ngSubmit)="submitRequest()"
    >


      <div class="form-row">

        <div class="form-group">

          <label>Your Name</label>

          <input
            type="text"
            formControlName="customer_name"
            placeholder="Enter your name"
          >

          <small
            *ngIf="
              requestForm.get('customer_name')?.touched &&
              requestForm.get('customer_name')?.invalid
            "
          >
            Name is required.
          </small>

        </div>


        <div class="form-group">

          <label>Phone Number</label>

          <input
            type="text"
            maxlength="10"
            formControlName="customer_phone"
            placeholder="10 digit mobile number"
          >

          <small
            *ngIf="
              requestForm.get('customer_phone')?.touched &&
              requestForm.get('customer_phone')?.invalid
            "
          >
            Enter a valid 10 digit mobile number.
          </small>

        </div>

      </div>


      <div class="form-group">

        <label>Select Service</label>

        <select formControlName="service_category_id">

          <option value="">
            Select a service
          </option>

          <option
            *ngFor="let service of services"
            [value]="service.id"
          >
            {{ service.name }}
            - ₹{{ service.base_price }}
          </option>

        </select>

      </div>


      <div class="form-group">

        <label>Describe the Problem</label>

        <textarea
          formControlName="description"
          placeholder="For example: Ceiling fan is not working..."
        ></textarea>

      </div>


      <div class="form-group">

        <label>Service Address</label>

        <textarea
          formControlName="address"
          placeholder="Enter complete service address"
        ></textarea>

      </div>


      <div class="form-row">

        <div class="form-group">

          <label>Preferred Date</label>

          <input
            type="date"
            formControlName="preferred_date"
          >

        </div>


        <div class="form-group">

          <label>Preferred Time</label>

          <input
            type="time"
            formControlName="preferred_time"
          >

        </div>

      </div>


      <button
        type="submit"
        class="submit-btn"
        [disabled]="submitting"
      >

        {{ submitting ? 'Submitting...' : 'Request Service' }}

      </button>

    </form>

  </div>

</div>
